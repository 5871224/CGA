<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="中國圍棋會官方網站與比賽管理平台開發規格書">
<title>中國圍棋會｜網站開發規格書</title>
<style>
:root{color-scheme:light;--green:#174c42;--green-2:#256b5e;--ink:#1c352d;--muted:#60736a;--edge:#dce8e0;--bg:#f5f8f6;--white:#fff}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.75}
a{text-decoration:none;color:inherit}
header{background:#fff;border-bottom:1px solid var(--edge)}
.top{max-width:1120px;margin:auto;padding:17px 24px;display:flex;align-items:center;gap:12px;font-weight:780;letter-spacing:.03em}
.mark{height:34px;width:34px;display:grid;place-items:center;background:#e3f0e9;color:var(--green);border-radius:10px;font:700 23px Georgia,serif}
main{max-width:1120px;margin:0 auto;padding:44px 24px 70px}
.hero{border-radius:20px;padding:56px 54px 60px;background:linear-gradient(118deg,#143e36,#23685b);color:#fff;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-110px;top:-150px;width:460px;height:460px;border:1px solid #ffffff26;border-radius:50%;box-shadow:0 0 0 65px #ffffff08,0 0 0 130px #ffffff05;pointer-events:none}
.hero h1{margin:0 0 13px;font-size:clamp(29px,4.5vw,46px);line-height:1.25;letter-spacing:.035em;position:relative;z-index:1}
.hero p{max-width:700px;margin:0;color:#dcebe5;font-size:16px;position:relative;z-index:1}
.section-title{font-size:20px;margin:36px 0 18px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.card{display:flex;flex-direction:column;padding:30px 30px 25px;background:var(--white);border:1px solid var(--edge);border-radius:16px;box-shadow:0 10px 28px #163d2b0a;min-height:272px}
.card .num{font-size:12px;color:var(--green-2);font-weight:800;letter-spacing:.12em}
.card h2{font-size:25px;margin:12px 0 10px;line-height:1.4}
.card p{color:var(--muted);margin:0 0 26px;font-size:15px}
.action{display:inline-flex;align-items:center;gap:9px;align-self:flex-start;margin-top:auto;border:1px solid #b7d4c6;border-radius:10px;padding:11px 17px;color:var(--green);font-size:14px;font-weight:750;transition:.16s}
.card:hover{border-color:#b4d3c3;transform:translateY(-1px);box-shadow:0 15px 36px #163d2b12}
.card:hover .action,.action:focus-visible{background:var(--green);border-color:var(--green);color:#fff}
footer{color:#87958d;font-size:13px;border-top:1px solid var(--edge);margin-top:36px;padding-top:18px}
@media(max-width:700px){main{padding:20px 15px 35px}.hero{padding:39px 27px}.cards{grid-template-columns:1fr}.card{min-height:235px;padding:25px}.section-title{margin-top:28px}.top{padding:13px 15px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card{transition:none}}
</style>
</head>
<body>
<header><div class="top"><span class="mark" aria-hidden="true">棋</span><span>中國圍棋會｜網站開發規格書</span></div></header>
<main>
<section class="hero">
<h1>網站開發規格書</h1>
<p>中國圍棋會官方網站與比賽管理平台的功能需求、頁面架構及驗收項目。兩份文件分開閱讀，方便確認各自的開發範圍。</p>
</section>
<h2 class="section-title">規格文件</h2>
<div class="cards">
<article class="card">
<div class="num">01 · 官方網站</div>
<h2>官方網站開發規格書</h2>
<p>首頁公告與活動、圍棋會介紹、段位名錄、賽事專區、公開資訊、快速連結、留言板及網站後台管理。</p>
<a class="action" href="./official-website.html" aria-label="閱讀官方網站開發規格書">閱讀規格書 <span aria-hidden="true">↗</span></a>
</article>
<article class="card">
<div class="num">02 · 比賽管理平台</div>
<h2>比賽管理平台規格書</h2>
<p>賽事設定、個人與團體報名、報到與費用紀錄、賽程、戰績表、桌次列印、帳號管理及留言板。</p>
<a class="action" href="./tournament-platform.html" aria-label="閱讀比賽管理平台規格書">閱讀規格書 <span aria-hidden="true">↗</span></a>
</article>
</div>
<footer>中國圍棋會｜開發需求與驗收規格文件</footer>
</main>
</body>
</html>
